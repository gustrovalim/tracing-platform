services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP, for the span-arrival check from the host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
