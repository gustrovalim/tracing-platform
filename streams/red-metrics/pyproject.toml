[project]
name = "red-metrics"
version = "1.0.0.dev0"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "opentelemetry-proto>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/red_metrics"]
